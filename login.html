<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ingreso | IP</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="Favicon.png" type="image/png">
<link rel="manifest" href="/Catalogo/manifest.json">


<style>
* { box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.login-card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 40px rgba(0,0,0,.25);
  text-align: center;
}

.login-card img {
  width: 90px;
  margin-bottom: 15px;
}

.login-card h2 {
  margin: 10px 0 5px;
  font-size: 26px;
  font-weight: 800;
  color: #1e293b;
}

.login-card p {
  margin-bottom: 25px;
  color: #64748b;
  font-size: 14px;
}

.login-card input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #cbd5f5;
  margin-bottom: 15px;
}

.login-card input:focus {
  outline: none;
  border-color: #2563eb;
}

.btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 12px;
}

.btn-primary { background: #2563eb; color: white; }
.btn-secondary { background: #111827; color: white; }
.btn:hover { opacity: 0.9; }

.info {
  font-size: 13px;
  color: #475569;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="login-card">
  <img src="logo.png" alt="IP">
  <h2>Ingreso de Empleado</h2>
  <p>Escanea tu código o ingresa tu número de empleado</p>
  <input id="empleadoInput" placeholder="Número de empleado">
  <button class="btn btn-primary" onclick="loginManual()">✍️ Ingresar</button>

  <div id="cameraBox" style="display:none; margin-top:20px;">
    <div id="barcode-reader" style="width:100%; height:260px;"></div>
    <button class="btn btn-secondary" onclick="cerrarCamara()">❌ Cancelar cámara</button>
  </div>

  <div class="info">El lector se activa automáticamente</div>
</div>

<script>
  // --- Limpieza automática de caché vieja (dispositivo siempre con internet) ---
(async function limpiarCacheVieja() {
  try {
    if ("caches" in window) {
      const nombres = await caches.keys();
      await Promise.all(nombres.map(nombre => caches.delete(nombre)));
    }
    if ("serviceWorker" in navigator) {
      const registros = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registros.map(reg => reg.unregister()));
    }
    // Borra datos offline guardados por versiones anteriores
    localStorage.removeItem("usuariosOffline");
    localStorage.removeItem("usuariosOfflineFecha");
    localStorage.removeItem("ingresosPendientes");
  } catch (err) {
    console.warn("No se pudo limpiar caché vieja:", err);
  }
})();
/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey: "AIzaSyCfS-TI8g2KEUWQmCafvf-Ig4KtZa2o_W8",
  authDomain: "catalogo-ee5b7.firebaseapp.com",
  projectId: "catalogo-ee5b7"
});

const db = firebase.firestore();

function normalizarCodigo(valor) {
  return String(valor || "").trim().replace(/\D/g, "").replace(/^0+/, "");
}


let bloqueado = false;

function iniciarSesion(codigo) {
  if (bloqueado) return;
  bloqueado = true;
  setTimeout(() => bloqueado = false, 2000);

  codigo = normalizarCodigo(codigo);
  if (!codigo) { alert("Código inválido"); return; }

  db.collection("usuarios").get()
    .then(snapshot => {
      const doc = snapshot.docs.find(d =>
        normalizarCodigo(d.data().control) === codigo
      );
      if (!doc) { alert("Empleado no registrado"); return; }
      completarLogin(doc.id, codigo, doc.data(), "online");
    })
    .catch(() => alert("Error de conexión, intenta de nuevo"));
}

function loginManual() {
  const codigo = document.getElementById("empleadoInput").value.trim();
  if (!codigo) return alert("Ingresa tu número");
  iniciarSesion(codigo);
}
  // NUEVO: permite dar Enter en el input para ingresar
document.getElementById("empleadoInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    loginManual();
  }
});

let buffer = "";
let timeout = null;

document.addEventListener("keydown", (e) => {
  if (document.activeElement.id === "empleadoInput") return;
  if (!/^[0-9]$/.test(e.key) && e.key !== "Enter") return;
  if (e.key === "Enter") {
    if (buffer.length >= 4) iniciarSesion(buffer);
    buffer = "";
    return;
  }
  buffer += e.key;
  clearTimeout(timeout);
  timeout = setTimeout(() => { buffer = ""; }, 80);
});

Quagga.onDetected(result => {
  const codigo = result.codeResult.code;
  Quagga.stop();
  document.getElementById("cameraBox").style.display = "none";
  iniciarSesion(codigo);
});

function cerrarCamara() {
  if (window.Quagga) Quagga.stop();
  document.getElementById("cameraBox").style.display = "none";
}

function completarLogin(docId, codigo, data, modo) {
  db.collection("ingresos").add({
    empleadoId: codigo,
    nombre: data.nombre,
    fecha: new Date(),
    origen: modo
  });

  sessionStorage.setItem("usuario", JSON.stringify({
    id: docId,
    nombre: data.nombre,
    puntos: data.puntosActuales,
    rol: data.rol || "usuario"
  }));

  sessionStorage.setItem("loginOrigen", window.location.href);
  window.location.href = "index.html";
}
</script>

</body>
</html>
