<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ingreso | IP</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="Favicon.png" type="image/png">
<link rel="manifest" href="manifest.json">
  <script>
const manifestData = {
  "name": "Tienda IP - Premios",
  "short_name": "IP Premios",
  "start_url": "./login.html",
  "display": "standalone",
  "background_color": "#0f172a",
  "theme_color": "#2563eb",
  "icons": [
    { "src": "Favicon.png", "sizes": "192x192", "type": "image/png" },
    { "src": "logo.png", "sizes": "512x512", "type": "image/png" }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type: "application/json"});
const url = URL.createObjectURL(blob);
document.querySelector('link[rel="manifest"]').href = url;
</script>
<meta name="theme-color" content="#2563eb">

  
<style>
* { box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

/* TARJETA */
.login-card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 40px rgba(0,0,0,.25);
  text-align: center;
}

/* LOGO */
.login-card img {
  width: 90px;
  margin-bottom: 15px;
}

/* TITULO */
.login-card h2 {
  margin: 10px 0 5px;
  font-size: 26px;
  font-weight: 800;
  color: #1e293b;
}

.login-card p {
  margin-bottom: 25px;
  color: #64748b;
  font-size: 14px;
}

/* INPUT */
.login-card input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #cbd5f5;
  margin-bottom: 15px;
}

.login-card input:focus {
  outline: none;
  border-color: #2563eb;
}

/* BOTONES */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 12px;
}

.btn-primary {
  background: #2563eb;
  color: white;
}

.btn-secondary {
  background: #111827;
  color: white;
}

.btn:hover {
  opacity: 0.9;
}

/* TEXTO */
.info {
  font-size: 13px;
  color: #475569;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="login-card">

  <img src="logo.png" alt="IP">

  <h2>Ingreso de Empleado</h2>
  <p>Escanea tu código o ingresa tu número de empleado</p>

  <input id="empleadoInput" placeholder="Número de empleado">

  <button class="btn btn-primary" onclick="loginManual()">✍️ Ingresar</button>


<div id="cameraBox" style="display:none; margin-top:20px;">
  <div id="barcode-reader" style="width:100%; height:260px;"></div>
  <button class="btn btn-secondary" onclick="cerrarCamara()">❌ Cancelar cámara</button>
</div>

  <div class="info">
    El lector se activa automaticamene
  </div>

</div>

<script>
/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey: "AIzaSyCfS-TI8g2KEUWQmCafvf-Ig4KtZa2o_W8",
  authDomain: "catalogo-ee5b7.firebaseapp.com",
  projectId: "catalogo-ee5b7"
});

const db = firebase.firestore();
 function normalizarCodigo(valor) {
  return String(valor || "").trim().replace(/\D/g, "").replace(/^0+/, "");
}

async function guardarUsuariosOffline() {
  try {
    if (!navigator.onLine) {
      console.log("Sin internet, no se actualizó usuariosOffline");
      return;
    }

    const snapshot = await db.collection("usuarios").get();

    const usuarios = snapshot.docs.map(doc => {
      const data = doc.data();
      return {
        id: doc.id,
        ...data,
        controlNormalizado: normalizarCodigo(data.control)
      };
    });

    localStorage.setItem("usuariosOffline", JSON.stringify(usuarios));
    localStorage.setItem("usuariosOfflineFecha", new Date().toLocaleString());


  } catch (error) {
    console.error("Error guardando usuarios offline:", error);
    alert("Error guardando usuarios offline: " + error.message);
  }
}

guardarUsuariosOffline();
let bloqueado = false;

  
  /* ===== LOGIN ===== */
function iniciarSesion(codigo) {
  if (bloqueado) return;
  bloqueado = true;

  setTimeout(() => bloqueado = false, 2000);

  codigo = normalizarCodigo(codigo);

  if (!codigo) {
    alert("Código inválido");
    return;
  }

  // PRIMERO BUSCAR OFFLINE
  const usuarios = JSON.parse(localStorage.getItem("usuariosOffline") || "[]");

  const usuarioLocal = usuarios.find(u =>
    normalizarCodigo(u.control) === codigo ||
    normalizarCodigo(u.controlNormalizado) === codigo
  );

  if (usuarioLocal) {
    completarLogin(usuarioLocal.id, codigo, usuarioLocal, "offline-local");
    return;
  }

  // SI NO LO ENCUENTRA LOCAL, BUSCA EN FIREBASE
  db.collection("usuarios")
    .where("control", "==", codigo)
    .limit(1)
    .get()
    .then(snapshot => {
      if (snapshot.empty) {
        alert("Empleado no registrado");
        return;
      }

      const doc = snapshot.docs[0];
      const data = doc.data();

      completarLogin(doc.id, codigo, data, "online");
    })
    .catch(error => {
      console.error("Error login:", error);
      alert("No hay internet y el empleado no está guardado localmente");
    });
}



  
function loginManual() {
  const codigo = document.getElementById("empleadoInput").value.trim();
  if (!codigo) return alert("Ingresa tu número");
  iniciarSesion(codigo);
}

/* ===== LECTOR AUTOMÁTICO GLOBAL ===== */
let buffer = "";
let timeout = null;

document.addEventListener("keydown", (e) => {

  // Ignorar si el usuario está escribiendo manualmente
  if (document.activeElement.id === "empleadoInput") return;

  // Solo aceptar números (la mayoría de lectores mandan números)
  if (!/^[0-9]$/.test(e.key) && e.key !== "Enter") return;

  // Cuando presiona ENTER → enviar código
  if (e.key === "Enter") {

    if (buffer.length >= 4) {
      iniciarSesion(buffer);
    }

    buffer = "";
    return;
  }

  // Agregar al buffer
  buffer += e.key;

  // Reset automático si tarda mucho (evita capturar teclado humano)
  clearTimeout(timeout);
  timeout = setTimeout(() => {
    buffer = "";
  }, 80); // más rápido = más preciso para lector
});

/* ===== CÁMARA ===== */
function usarCamara() {
  document.getElementById("cameraBox").style.display = "block";

  Quagga.init({
    inputStream: {
      name: "Live",
      type: "LiveStream",
      target: document.querySelector("#barcode-reader"),
      constraints: { facingMode: "environment" }
    },
    decoder: {
      readers: ["code_128_reader"]
    }
  }, err => {
    if (err) {
      alert("No se pudo abrir la cámara");
      return;
    }
    Quagga.start();
  });
}

let yaDetectado = false;

Quagga.onDetected(result => {
  const codigo = result.codeResult.code;
  Quagga.stop();
  document.getElementById("cameraBox").style.display = "none";
  iniciarSesion(codigo);
});


function cerrarCamara() {
  if (window.Quagga) Quagga.stop();
  document.getElementById("cameraBox").style.display = "none";
}

/* ===== GUARDAR USUARIOS LOCALMENTE ===== */

function buscarUsuarioOffline(codigo) {
  codigo = normalizarCodigo(codigo);

  const usuarios = JSON.parse(localStorage.getItem("usuariosOffline") || "[]");

  console.log("Buscando offline código:", codigo);
  console.log("Usuarios offline disponibles:", usuarios.length);

  const usuario = usuarios.find(u =>
    normalizarCodigo(u.control) === codigo ||
    normalizarCodigo(u.controlNormalizado) === codigo
  );

  if (!usuario) {
    alert("Empleado no guardado offline. Usuarios cargados: " + usuarios.length);
    return;
  }

  completarLogin(usuario.id, codigo, usuario, "offline");
}

function completarLogin(docId, codigo, data, modo) {
  const ingreso = {
    empleadoId: codigo,
    nombre: data.nombre,
    fecha: new Date(),
    origen: modo
  };

  if (navigator.onLine) {
    db.collection("ingresos").add(ingreso);
  } else {
    const pendientes = JSON.parse(localStorage.getItem("ingresosPendientes") || "[]");
    pendientes.push(ingreso);
    localStorage.setItem("ingresosPendientes", JSON.stringify(pendientes));
  }

  sessionStorage.setItem("usuario", JSON.stringify({
    id: docId,
    nombre: data.nombre,
    puntos: data.puntosActuales,
    rol: data.rol || "usuario"
  }));

  sessionStorage.setItem("loginOrigen", window.location.href);
  window.location.href = "index.html";
}
  
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")

    .catch(err => console.error("Error PWA:", err));
}
<script src="sync.js"></script>

</body>
</html>
