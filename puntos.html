<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Puntos IP</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<link rel="icon" href="Favicon.png" type="image/png">

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  padding: 30px;
}

h1 {
  text-align: center;
}

table {
  width: 100%;
  background: white;
  border-collapse: collapse;
  margin-top: 20px;
}

th {
  background: #111827;
  color: white;
  padding: 10px;
}

td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0 25px 0;
  gap: 15px;
  flex-wrap: wrap;
}

.input-premios {
  height: 36px;
  padding: 0 12px;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
}

.input-premios:focus {
  border-color: #111827;
}

.btn-premios {
  height: 36px;
  padding: 0 16px;
  border-radius: 6px;
  background: #111827;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
}

.btn-premios:hover {
  background: #1f2937;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.admin-login {
  display: flex;
  align-items: center;
  gap: 8px;
}

.admin-only {
  display: table-cell;
}

.admin-panel {
  display: block !important;
  background: white;
  padding: 15px;
  margin: 20px 0;
  max-width: 400px;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

.admin-mode .admin-only {
  display: table-cell;
}

.admin-mode .admin-panel {
  display: block;
}

table th,
table td {
  text-align: center;
  vertical-align: middle;
}

table td button {
  margin: 0 4px;
}
</style>
</head>

<body>

<a href="index.html" class="btn-premios">
  ⬅ Volver a premios
</a>

<h1>👤 Puntos IP</h1>

<div class="top-bar">
  <input
    type="text"
    id="buscador"
    class="input-premios"
    placeholder="🔍 Buscar..."
    oninput="filtrarUsuarios()"
  >

  <div class="admin-only">
    <input type="file" id="excelInput" accept=".xlsx,.xls">
    <button id="btnImportar" onclick="importarExcel()">
      📥Importar
    </button>
    <button id="btnExportar" onclick="exportarExcel()">
      📤Exportar
    </button>
  </div>
</div>

<div id="formUsuarios" class="admin-panel" style="display:none;">
  <h3>Administrar usuario</h3>

  <input type="hidden" id="userId">

  <input id="controlUsuario" placeholder="Número de control">
  <br><br>

  <input id="nombreUsuario" placeholder="Nombre">
  <br><br>

  <input id="areaUsuario" placeholder="Área">
  <br><br>

  <input
    id="puntosUsuario"
    type="number"
    placeholder="Puntos actuales"
  >
  <br><br>

  <textarea
    id="comentariosPuntosUsuario"
    placeholder="Comentarios"
    rows="3"
    style="width:100%;"
  ></textarea>
  <br><br>

  <textarea
    id="comentariosUsuario"
    placeholder="Comentarios"
    rows="3"
    style="width:100%;"
  ></textarea>
  <br><br>

  <button
    id="btnGuardar"
    class="btn-premios"
    onclick="guardarUsuario()"
  >
    Guardar
  </button>

  <button
    id="btnCancelar"
    class="btn-premios"
    onclick="cancelarUsuario()"
  >
    Cancelar
  </button>
</div>

<table>
  <thead>
    <tr>
      <th>Control</th>
      <th>Nombre</th>
      <th>Puntos</th>
      <th class="admin-only">Área</th>
      <th class="admin-only">Comentarios de puntos</th>
      <th class="admin-only">Comentarios</th>
      <th class="admin-only">Acciones</th>
    </tr>
  </thead>

  <tbody id="listaPuntos"></tbody>
</table>

<script>
/* ===== PROTECCIÓN SOLO ADMIN ===== */

let usuario = null;

try {
  usuario = JSON.parse(sessionStorage.getItem("usuario") || "null");
} catch (error) {
  console.error("Sesión inválida:", error);
}

if (!usuario) {
  window.location.replace("login.html");
} else if (usuario.rol !== "admin") {
  alert("Acceso restringido");
  window.location.replace("index.html");
}

/* ===== FIREBASE ===== */

firebase.initializeApp({
  apiKey: "AIzaSyCfS-TI8g2KEUWQmCafvf-Ig4KtZa2o_W8",
  authDomain: "catalogo-ee5b7.firebaseapp.com",
  projectId: "catalogo-ee5b7"
});

const db = firebase.firestore();

db.enablePersistence().catch(error => {
  console.log("Persistencia no disponible", error.code);
});

const usuariosRef = db.collection("usuarios");

let usuariosCache = [];
let guardandoUsuario = false;
let importandoExcel = false;

/* Misma normalización que utiliza login.html. */
function normalizarCodigo(valor) {
  return String(valor ?? "")
    .trim()
    .replace(/\D/g, "")
    .replace(/^0+/, "");
}

/* ===== DOM ===== */

const listaPuntos = document.getElementById("listaPuntos");
const formUsuarios = document.getElementById("formUsuarios");

const userId = document.getElementById("userId");
const controlUsuario = document.getElementById("controlUsuario");
const nombreUsuario = document.getElementById("nombreUsuario");
const puntosUsuario = document.getElementById("puntosUsuario");
const comentariosPuntosUsuario =
  document.getElementById("comentariosPuntosUsuario");
const comentariosUsuario =
  document.getElementById("comentariosUsuario");
const areaUsuario = document.getElementById("areaUsuario");

/* ===== CARGAR USUARIOS ===== */

if (usuario?.rol === "admin") {
  usuariosRef.onSnapshot(snapshot => {
    usuariosCache = snapshot.docs.map(doc => ({
      ...doc.data(),
      id: doc.id
    }));

    filtrarUsuarios();
  }, error => {
    console.error("Error al cargar usuarios:", error);
    alert("No se pudieron cargar los usuarios. Revisa la conexión.");
  });
}

function renderUsuariosOrdenados(snapshot) {
  usuariosCache = snapshot.docs.map(doc => ({
    ...doc.data(),
    id: doc.id
  }));

  filtrarUsuarios();
}

/* ===== TABLA ===== */

function pintarTabla(lista) {
  listaPuntos.replaceChildren();

  lista.forEach(u => {
    const fila = document.createElement("tr");

    const valores = [
      u.control ?? "",
      u.nombre ?? "",
      u.puntosActuales ?? 0,
      u.area ?? "",
      u.comentariosPuntos ?? "",
      u.comentarios ?? ""
    ];

    valores.forEach((valor, indice) => {
      const celda = document.createElement("td");
      celda.textContent = valor;

      if (indice >= 3) {
        celda.className = "admin-only";
      }

      fila.appendChild(celda);
    });

    const acciones = document.createElement("td");
    acciones.className = "admin-only";

    const editar = document.createElement("button");
    editar.textContent = "✏️";
    editar.onclick = () => editarUsuario(u.id);

    const eliminar = document.createElement("button");
    eliminar.textContent = "🗑️";
    eliminar.onclick = () => eliminarUsuario(u.id);

    acciones.append(editar, eliminar);
    fila.appendChild(acciones);
    listaPuntos.appendChild(fila);
  });
}

/* ===== GUARDAR / EDITAR ===== */

async function guardarUsuario() {
  if (usuario?.rol !== "admin") return;
  if (guardandoUsuario || importandoExcel) return;

  const control = controlUsuario.value.trim();
  const controlNormalizado = normalizarCodigo(control);

  if (!controlNormalizado || !/^\d+$/.test(control)) {
    alert("Ingresa un número de empleado válido, solamente con dígitos.");
    return;
  }

  if (!nombreUsuario.value.trim()) {
    alert("Ingresa el nombre del empleado.");
    return;
  }

  const data = {
    control,
    controlNormalizado,
    nombre: nombreUsuario.value.trim(),
    area: areaUsuario.value || "",
    puntosActuales: Number(puntosUsuario.value) || 0,
    comentariosPuntos: comentariosPuntosUsuario.value || "",
    comentarios: comentariosUsuario.value || ""
  };

  // Conserva el ID existente al editar.
  const idFinal = userId.value || control;

  guardandoUsuario = true;

  const boton = document.getElementById("btnGuardar");
  const cancelar = document.getElementById("btnCancelar");

  boton.disabled = true;
  cancelar.disabled = true;
  boton.textContent = "Guardando...";

  try {
    await usuariosRef.doc(idFinal).set(data, { merge: true });

    cancelarUsuario();
    alert("✅ Usuario guardado correctamente.");
  } catch (error) {
    console.error("Error al guardar usuario:", error);
    alert(
      "No se pudo confirmar el guardado. " +
      "Revisa la conexión y el mensaje de Firebase en la consola."
    );
  } finally {
    guardandoUsuario = false;
    boton.disabled = false;
    cancelar.disabled = false;
    boton.textContent = "Guardar";
  }
}

/* ===== EDITAR ===== */

function editarUsuario(id) {
  if (guardandoUsuario || importandoExcel) return;

  const u = usuariosCache.find(user => user.id === id);
  if (!u) return;

  userId.value = id;
  controlUsuario.value = u.control ?? "";
  nombreUsuario.value = u.nombre ?? "";
  areaUsuario.value = u.area ?? "";
  puntosUsuario.value = u.puntosActuales ?? 0;
  comentariosPuntosUsuario.value = u.comentariosPuntos ?? "";
  comentariosUsuario.value = u.comentarios ?? "";
}

/* ===== ELIMINAR ===== */

async function eliminarUsuario(id) {
  if (usuario?.rol !== "admin") return;
  if (guardandoUsuario || importandoExcel) return;

  if (!confirm("¿Eliminar usuario?")) return;

  try {
    await usuariosRef.doc(id).delete();
  } catch (error) {
    console.error("Error al eliminar usuario:", error);
    alert("No se pudo confirmar la eliminación del usuario.");
  }
}

/* ===== LIMPIAR FORMULARIO ===== */

function cancelarUsuario() {
  userId.value = "";
  controlUsuario.value = "";
  nombreUsuario.value = "";
  areaUsuario.value = "";
  puntosUsuario.value = "";
  comentariosPuntosUsuario.value = "";
  comentariosUsuario.value = "";
}

/* ===== IMPORTAR EXCEL ===== */

async function importarExcel() {
  if (usuario?.rol !== "admin") return;
  if (importandoExcel || guardandoUsuario) return;

  const file = document.getElementById("excelInput").files[0];

  if (!file) {
    alert("Selecciona un archivo Excel");
    return;
  }

  importandoExcel = true;

  const boton = document.getElementById("btnImportar");
  boton.disabled = true;
  boton.textContent = "Importando...";

  let importados = 0;

  try {
    const contenido = await file.arrayBuffer();
    const workbook = XLSX.read(
      new Uint8Array(contenido),
      { type: "array" }
    );

    const sheet = workbook.Sheets[workbook.SheetNames[0]];

    if (!sheet) {
      throw new Error("El archivo no contiene una hoja válida.");
    }

    const rows = XLSX.utils.sheet_to_json(sheet);

    if (!rows.length) {
      alert("El archivo no contiene usuarios.");
      return;
    }

    if (!rows.some(row =>
      Object.prototype.hasOwnProperty.call(row, "control")
    )) {
      alert(
        'El Excel debe tener una columna llamada "control".\n\n' +
        "Utiliza el formato del botón Exportar: control, nombre, " +
        "area, puntosActuales, comentariosPuntos y comentarios."
      );
      return;
    }

    // Validar todas las filas antes de empezar a guardar.
    const registros = [];

    for (let indice = 0; indice < rows.length; indice++) {
      const row = rows[indice];

      if (
        row.control === undefined ||
        row.control === null ||
        String(row.control).trim() === ""
      ) {
        continue;
      }

      const control = String(row.control).trim();
      const controlNormalizado = normalizarCodigo(control);

      if (!controlNormalizado || !/^\d+$/.test(control)) {
        throw new Error(
          "Número de empleado inválido en el registro " +
          (indice + 1) + ": " + control
        );
      }

      const dataUsuario = {
        control,
        controlNormalizado
      };

      /*
       * Actualizar únicamente las columnas presentes.
       * Si el Excel no incluye puntos, conserva los existentes.
       */
      if (Object.prototype.hasOwnProperty.call(row, "nombre")) {
        dataUsuario.nombre = row.nombre ?? "";
      }

      if (Object.prototype.hasOwnProperty.call(row, "area")) {
        dataUsuario.area = row.area ?? "";
      }

      if (
        Object.prototype.hasOwnProperty.call(row, "puntosActuales")
      ) {
        const puntos = Number(row.puntosActuales);

        if (!Number.isFinite(puntos)) {
          throw new Error(
            "Puntos inválidos para el empleado " + control
          );
        }

        dataUsuario.puntosActuales = puntos;
      }

      if (
        Object.prototype.hasOwnProperty.call(row, "comentariosPuntos")
      ) {
        dataUsuario.comentariosPuntos = row.comentariosPuntos ?? "";
      }

      if (
        Object.prototype.hasOwnProperty.call(row, "comentarios")
      ) {
        dataUsuario.comentarios = row.comentarios ?? "";
      }

      registros.push({
        id: control,
        data: dataUsuario
      });
    }

    if (!registros.length) {
      alert('No se encontraron números en la columna "control".');
      return;
    }

    // Mantiene el número de control como ID, como el código original.
    for (const registro of registros) {
      await usuariosRef
        .doc(registro.id)
        .set(registro.data, { merge: true });

      importados++;
      boton.textContent =
        "Importando " + importados + "/" + registros.length;
    }

    alert(
      "✅ Excel importado correctamente.\n" +
      "Registros guardados: " + importados
    );
  } catch (error) {
    console.error("Error al importar Excel:", error);

    alert(
      "La importación no se completó.\n" +
      "Registros confirmados: " + importados + "\n\n" +
      error.message
    );
  } finally {
    importandoExcel = false;
    boton.disabled = false;
    boton.textContent = "📥Importar";
  }
}

/* ===== EXPORTAR EXCEL ===== */

function exportarExcel() {
  const btn = document.getElementById("btnExportar");
  btn.disabled = true;
  btn.innerText = "Exportando...";

  try {
    const data = usuariosCache.map(u => ({
      control: u.control ?? "",
      nombre: u.nombre ?? "",
      area: u.area ?? "",
      puntosActuales: u.puntosActuales ?? 0,
      comentariosPuntos: u.comentariosPuntos ?? "",
      comentarios: u.comentarios ?? ""
    }));

    if (data.length === 0) {
      alert("No hay datos para exportar");
      return;
    }

    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Usuarios");
    XLSX.writeFile(wb, "usuarios_puntos.xlsx");
  } catch (error) {
    console.error("Error al exportar:", error);
    alert("No se pudo exportar el archivo.");
  } finally {
    btn.disabled = false;
    btn.innerText = "📤Exportar";
  }
}

/* ===== BUSCADOR ===== */

function filtrarUsuarios() {
  const texto = document
    .getElementById("buscador")
    .value
    .toLowerCase();

  const filtrados = usuariosCache.filter(u =>
    String(u.control ?? "").toLowerCase().includes(texto) ||
    String(u.nombre ?? "").toLowerCase().includes(texto) ||
    String(u.area ?? "").toLowerCase().includes(texto)
  );

  pintarTabla(filtrados);
}

window.onload = function() {
  if (usuario?.rol !== "admin") return;

  document.body.classList.add("admin-mode");
  formUsuarios.style.display = "block";
};
</script>

</body>
</html>
